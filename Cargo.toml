[package]
name = "jj-conflict-workspace"
version = "0.2.1"
edition = "2024"

[lib]
name = "jj_conflict_workspace"
path = "src/lib.rs"

[[bin]]
name = "jcw"
path = "src/main.rs"

[features]
default = []
test-support = []

[[bin]]
name = "jcw-fake-jj"
path = "tests/support/fake_jj.rs"
required-features = ["test-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
filetime = "0.2"
sha2 = "0.10"
