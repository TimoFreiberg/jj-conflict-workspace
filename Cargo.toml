[package]
name = "jj-conflict-workspace"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/TimoFreiberg/jj-conflict-workspace"
description = "CLI tool that offers coding agents a more convenient view on jj conflicts"
license = "MIT"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/jcw-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "jj_conflict_workspace"
path = "src/lib.rs"

[[bin]]
name = "jcw"
path = "src/main.rs"

[features]
default = []
test-support = []

[[bin]]
name = "jcw-fake-jj"
path = "tests/support/fake_jj.rs"
required-features = ["test-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
filetime = "0.2"
sha2 = "0.10"
